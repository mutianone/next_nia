<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>境智 · 手机布局预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f3;color:#294451;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;padding:24px 16px}header strong{font-size:16px}header span{font-size:12px;color:#728692}.sizes{display:flex;gap:6px}.sizes button{border:1px solid #cbd9df;background:#fff;border-radius:6px;padding:7px 13px;color:#456775;cursor:pointer}.sizes button[aria-pressed=true]{background:#245d78;color:white}main{display:flex;justify-content:center;padding:0 12px 30px}.phone{width:390px;height:844px;max-width:100%;border:7px solid #233e4a;border-radius:29px;box-sizing:content-box;overflow:hidden;box-shadow:0 18px 60px #1e485420;background:white}iframe{width:100%;height:100%;border:0;display:block}footer{text-align:center;font-size:12px;color:#6d8390;padding:0 20px 25px;line-height:1.8}a{color:#245d78}@media(max-width:470px){header{gap:10px;padding:15px}.phone{border-width:3px;height:calc(100dvh - 180px);min-height:560px;border-radius:16px}main{padding:0 10px 20px}}
</style></head><body><header><strong>境智 · 手机布局预览</strong><span>按实际视口宽度展示</span><div class="sizes"><button aria-pressed="false" data-width="360">360 px</button><button aria-pressed="true" data-width="390">390 px</button><button aria-pressed="false" data-width="430">430 px</button></div></header><main><div class="phone"><iframe src="/" title="手机端境智工作台"></iframe></div></main><footer>本页用于检查响应式布局，录音与设备能力仍需后续真机验证。<br><a href="/">返回完整工作台</a></footer><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.phone').style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));</script></body></html>
